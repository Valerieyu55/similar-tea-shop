<title>比不比熟成紅茶</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&family=Noto+Sans+TC:wght@500;700&display=swap">
<style>
/* Layout: pixel-art shop management game. Every panel is a stepped-corner pixel window; scenes are low-res canvases scaled with nearest-neighbour.
   Single theme on purpose (night-blue game UI, warm shop interior). */
:root{
  color-scheme:dark;
  --bg:#141a33; --bg2:#1b2244; --win:#1f2a5c; --win2:#2a3874; --edge:#0b0f24; --cream:#fff3d6;
  --fg:#fff8ea; --fg2:#c9d0f0; --fg3:#8c95c4;
  --yel:#ffd34e; --yel-d:#c98f1a; --yel-l:#fff0a8;
  --grn:#5ec95a; --grn-d:#2f8a3a; --red:#e8504a; --pink:#ff8fab; --tea:#e09a55; --pearl:#2a1c15;
  --paper:#fff6e2; --paper2:#f3e3c0; --paper-ink:#3a2618; --paper-mut:#7d634b;
  --lcd:#1c2b17; --lcd-fg:#b8f28c;
  --f:"DotGothic16","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f8:"Press Start 2P","DotGothic16",monospace;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
  --cut:polygon(6px 0,calc(100% - 6px) 0,calc(100% - 6px) 3px,calc(100% - 3px) 3px,calc(100% - 3px) 6px,100% 6px,100% calc(100% - 6px),calc(100% - 3px) calc(100% - 6px),calc(100% - 3px) calc(100% - 3px),calc(100% - 6px) calc(100% - 3px),calc(100% - 6px) 100%,6px 100%,6px calc(100% - 3px),3px calc(100% - 3px),3px calc(100% - 6px),0 calc(100% - 6px),0 6px,3px 6px,3px 3px,6px 3px);
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:8px 8px;color:var(--fg);font-family:var(--f);font-size:16px;line-height:1.7;overflow-x:hidden;-webkit-font-smoothing:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:90;background:var(--bg)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px dashed var(--yel);outline-offset:3px}
h1,h2,h3,p{margin:0;font-weight:400}
.px{image-rendering:pixelated;image-rendering:crisp-edges}
canvas.px,img.px{display:block}
.p8{font-family:var(--f8)}

/* pixel window */
.win{position:relative;background:var(--win);clip-path:var(--cut);padding:16px 18px;box-shadow:inset 0 0 0 3px var(--edge),inset 0 0 0 6px var(--cream),inset 0 0 0 9px var(--edge),inset 0 12px 0 9px rgba(255,255,255,.06)}
.win.pad{padding:22px 22px}
.win.paper{background:var(--paper);color:var(--paper-ink);box-shadow:inset 0 0 0 3px var(--edge),inset 0 0 0 6px #e6c98f,inset 0 0 0 9px var(--edge)}
.wtitle{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.wtitle b{font-weight:400;font-size:18px;color:var(--yel)}
.wtitle small{font-family:var(--f8);font-size:8px;color:var(--fg3);letter-spacing:.1em}
.win.paper .wtitle b{color:var(--red)}

/* pixel buttons */
.pbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:8px 22px;border:0;cursor:pointer;background:var(--yel);color:#2a1c06;font-size:18px;clip-path:var(--cut);box-shadow:inset 0 0 0 3px var(--edge),inset -6px -6px 0 0 var(--yel-d),inset 6px 6px 0 0 var(--yel-l);transition:transform .05s}
.pbtn:hover{filter:brightness(1.06)}
.pbtn:active{transform:translateY(2px);box-shadow:inset 0 0 0 3px var(--edge),inset 6px 6px 0 0 var(--yel-d),inset -6px -6px 0 0 var(--yel-l)}
.pbtn.alt{background:#4a5aa0;color:var(--fg);box-shadow:inset 0 0 0 3px var(--edge),inset -6px -6px 0 0 #2e3a72,inset 6px 6px 0 0 #7a8ad0}
.pbtn.sm{min-height:38px;padding:4px 16px;font-size:16px}
.pbtn:disabled{filter:grayscale(.8) brightness(.7);cursor:default;transform:none}
.chipbtn{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:2px 12px;border:0;cursor:pointer;background:var(--win2);color:var(--fg);font-size:15px;clip-path:var(--cut);box-shadow:inset 0 0 0 3px var(--edge),inset 0 0 0 5px #4c5ca8}
.chipbtn[aria-pressed="true"]{background:var(--grn-d);box-shadow:inset 0 0 0 3px var(--edge),inset 0 0 0 5px var(--grn)}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;padding:10px var(--gr) 10px var(--gl);background:var(--edge);border-bottom:3px solid #2e3a72}
.hud-l{display:flex;align-items:center;gap:10px;min-width:0}
.hud-l img{width:32px;height:32px}
.hud-t{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.hud-t small{font-family:var(--f8);font-size:8px;color:var(--yel)}
.hud-t b{font-weight:400;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-r{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap}
.stat{display:inline-flex;align-items:center;gap:8px;background:var(--win);padding:5px 12px;clip-path:var(--cut);box-shadow:inset 0 0 0 3px #2e3a72;font-family:var(--f8);font-size:11px}
.stat img{width:16px;height:16px}
.lv{color:var(--grn)}
.seg{display:inline-block;width:70px;height:10px;background:#0b0f24;position:relative}
.seg i{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(90deg,var(--grn) 0 5px,transparent 5px 7px);transition:width .4s steps(10)}
.prog{display:inline-block;width:110px;height:10px;background:#0b0f24;position:relative}
.prog i{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(90deg,var(--yel) 0 5px,transparent 5px 7px);transition:width .3s}

/* TITLE */
.title{position:relative;min-height:100vh;display:flex;align-items:flex-end;overflow:hidden}
.title canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:78% 50%}
.title::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,15,36,.82) 0%,rgba(11,15,36,.45) 48%,rgba(11,15,36,0) 75%);pointer-events:none}
.tt{position:relative;z-index:2;padding:48px var(--gr) 56px var(--gl);width:100%;max-width:1200px;margin:0 auto}
.kick{font-family:var(--f8);font-size:10px;color:var(--yel);letter-spacing:.12em;line-height:2}
.logo{font-size:clamp(52px,10vw,120px);line-height:1.1;color:var(--cream);text-shadow:4px 0 0 var(--edge),-4px 0 0 var(--edge),0 4px 0 var(--edge),0 -4px 0 var(--edge),4px 4px 0 var(--edge),-4px 4px 0 var(--edge),4px -4px 0 var(--edge),-4px -4px 0 var(--edge),0 10px 0 #a2541f,4px 10px 0 var(--edge),-4px 10px 0 var(--edge),0 14px 0 var(--edge);margin:10px 0 18px}
.logo span{color:var(--yel)}
.tt-lead{font-size:18px;line-height:1.9;color:var(--fg);max-width:24em;text-shadow:2px 2px 0 var(--edge)}
.tt-menu{display:flex;gap:14px;flex-wrap:wrap;margin-top:28px}
.press{margin-top:22px;font-family:var(--f8);font-size:11px;color:var(--yel);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.tt-foot{margin-top:24px;font-size:14px;color:var(--fg2);text-shadow:2px 2px 0 var(--edge)}

/* HUB */
.hubgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;padding:18px var(--gr) 48px var(--gl);max-width:1360px;margin:0 auto;align-items:start}
.shop{position:relative;padding:12px}
.shopwrap{position:relative;width:100%;aspect-ratio:240/150;max-width:100%}
.shopwrap canvas{position:absolute;inset:0;width:100%;height:100%}
.zone{position:absolute;border:0;background:transparent;cursor:pointer;padding:0}
.zone:hover,.zone.sel{outline:3px dashed var(--yel);outline-offset:-3px}
.zone:focus-visible{outline:3px solid var(--yel);outline-offset:-3px}
.ztag{position:absolute;left:50%;bottom:calc(100% - 4px);transform:translateX(-50%);white-space:nowrap;background:var(--edge);color:var(--fg);font-size:13px;line-height:1;padding:5px 8px 4px;clip-path:var(--cut);pointer-events:none}
.ztag em{font-style:normal;color:var(--yel);font-size:11px;margin-left:4px}
.ztag.go{background:var(--red)}
.daybar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:14px;color:var(--fg2)}
.daybar .p8{font-size:9px;color:var(--yel)}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.prof{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:center}
.prof img{width:72px;height:72px;background:#3a4a8a;box-shadow:0 0 0 3px var(--edge)}
.prof .nm{font-size:20px;line-height:1.3}
.prof .rk{font-size:14px;color:var(--grn)}
.bigseg{height:12px;background:#0b0f24;position:relative;margin-top:6px}
.bigseg i{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(90deg,var(--grn) 0 8px,transparent 8px 10px)}
.prof .xt{font-family:var(--f8);font-size:8px;color:var(--fg3);margin-top:6px}
.zi-no{font-family:var(--f8);font-size:22px;color:var(--yel)}
.zi-h{display:flex;align-items:center;gap:12px}
.zi-h h3{font-size:22px;line-height:1.3}
.zi-unit{font-size:14px;color:var(--fg2)}
.zi-hook{font-size:17px;line-height:1.75;margin:8px 0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tag{font-size:13px;padding:1px 8px;background:#33418a;clip-path:var(--cut)}
.tag.go{background:var(--red)}.tag.ok{background:var(--grn-d)}
.stars{font-size:20px;letter-spacing:4px;color:#3b4580;margin-bottom:10px}
.stars .on{color:var(--yel)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rc{padding:8px 10px;background:#2c3a7e;clip-path:var(--cut);box-shadow:inset 0 0 0 3px #4c5ca8;font-size:14px;line-height:1.45;min-width:0}
.rc b{display:block;font-weight:400;font-size:12px;color:var(--yel)}
.rc.gold{background:#5a4214;box-shadow:inset 0 0 0 3px var(--yel);animation:glint 2s steps(2) infinite}
@keyframes glint{50%{box-shadow:inset 0 0 0 3px var(--yel-l)}}
.rc.lock{background:#1a2148;box-shadow:inset 0 0 0 3px #2e3a72;color:var(--fg3)}
.rc.lock b{color:var(--fg3)}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--fg3)}
.lnk{background:none;border:0;padding:0;color:var(--fg2);text-decoration:underline;cursor:pointer;font-size:13px}

/* STAGE */
.stage{position:relative;min-height:100vh;display:flex;flex-direction:column}
.stage>canvas{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.stage::after{content:"";position:fixed;inset:0;background:rgba(11,15,36,.18);z-index:0;pointer-events:none}
.stage .hud{position:relative;top:auto;z-index:3}
.arena{position:relative;z-index:2;flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:24px;padding:18px var(--gr) 18px var(--gl);align-items:start;max-width:1360px;width:100%;margin:0 auto}
.arena.nobench{grid-template-columns:minmax(0,760px);justify-content:center}
.arena.nobench .bench{display:none}
.left{min-width:0;display:flex;flex-direction:column;gap:16px}
.boxslot{position:sticky;bottom:0;z-index:4;padding:0 var(--gr) calc(16px + env(safe-area-inset-bottom,0px)) var(--gl)}
.dbox{max-width:1100px;margin:0 auto;display:flex;gap:16px;align-items:flex-start;min-height:150px;cursor:pointer;padding:20px 22px 26px}
.dbox.hide{display:none}
.dface{width:96px;height:96px;flex:none;background:#3a4a8a;box-shadow:0 0 0 3px var(--edge),0 0 0 6px var(--cream)}
.dface img{width:96px;height:96px}
.dname{display:inline-block;font-size:16px;color:#2a1c06;background:var(--yel);padding:0 10px;margin-bottom:6px;clip-path:var(--cut)}
.dname.fin{background:var(--grn)}.dname.cus{background:var(--pink)}.dname.you{background:var(--cream)}
.dtext{font-size:clamp(17px,1.8vw,20px);line-height:1.85;flex:1;min-width:0}
.dtext b{font-weight:400;color:var(--yel)}
.dbox.nar .dtext{color:var(--fg2)}
.bkbtn{position:absolute;left:22px;bottom:8px;background:none;border:0;padding:2px 4px;font-size:14px;color:var(--fg3);cursor:pointer}
.bkbtn:hover{color:var(--yel)}
.tk .bkbtn{position:static;display:inline-block;margin-top:12px;color:var(--paper-mut)}
.tk .bkbtn:hover{color:var(--red)}
.dname.rd{background:#9fc4ff}.dname.des{background:#c9a0ff}
.opts.long{grid-template-columns:minmax(0,1fr)}.opts.long .opt{font-family:var(--f);font-size:18px;line-height:1.5}
.tmtag{background:var(--grn-d);cursor:default;box-shadow:inset 0 0 0 3px var(--edge),inset 0 0 0 5px var(--grn)}
.ztag.lock{background:#3b4580;color:var(--fg3)}.zone.locked{cursor:not-allowed}
.sw{display:inline-block;width:10px;height:10px;margin-right:6px;box-shadow:0 0 0 2px var(--edge);vertical-align:-1px}
.chk{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.chk span{font-size:14px;padding:2px 8px;background:#4a2430;color:var(--fg2);clip-path:var(--cut)}.chk span.on{background:var(--grn-d);color:#eaffdf}
.dmore{position:absolute;right:22px;bottom:12px;color:var(--yel);font-size:14px;animation:blink .8s steps(2) infinite}

/* order ticket */
.tk{animation:tkIn .3s steps(4) both;max-width:720px}
@keyframes tkIn{from{transform:translateY(24px);opacity:0}}
.tk-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:3px dashed #d8c08f;padding-bottom:10px;margin-bottom:12px}
.tk-no{font-family:var(--f8);font-size:11px;color:var(--red)}
.tk-tag{font-size:14px;color:var(--paper-mut)}
.tk-rw{margin-left:auto;display:flex;gap:6px;font-family:var(--f8);font-size:9px}
.tk-rw span{background:#ecd9b0;padding:4px 8px}
.tk-p{font-size:clamp(18px,1.8vw,21px);line-height:1.85;margin-bottom:14px}
.tk-in{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lcd{display:flex;align-items:center;gap:8px;background:var(--lcd);padding:8px 14px;clip-path:var(--cut);box-shadow:inset 0 0 0 3px var(--edge),inset 0 0 0 6px #4a5a3a}
.lcd input{width:6.5ch;max-width:44vw;background:transparent;border:0;color:var(--lcd-fg);font-family:var(--f8);font-size:20px;text-align:right;padding:6px 0}
.lcd input::placeholder{color:#4f6e3c}
.lcd input:focus{outline:none}
.lcd .u{color:#8fc76a;font-size:16px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{display:flex;gap:12px;align-items:center;padding:10px 14px;border:0;cursor:pointer;background:#fffaf0;color:var(--paper-ink);font-family:var(--f8);font-size:14px;clip-path:var(--cut);box-shadow:inset 0 0 0 3px var(--edge),inset -4px -4px 0 0 #dcc49a;min-height:52px;text-align:left}
.opt .ol{display:inline-grid;place-items:center;width:26px;height:26px;background:var(--edge);color:var(--yel);font-size:11px;flex:none}
.opt:hover:not(:disabled){background:#fff0c2}
.opt:disabled{cursor:default}
.opt.yes{background:#c9f0c0;box-shadow:inset 0 0 0 3px var(--edge),inset 0 0 0 6px var(--grn)}
.opt.no{background:#f4cfc8;opacity:.6}
.tk-tools{margin-top:12px}
.ptool{background:none;border:0;border-bottom:2px dashed var(--paper-mut);padding:0;font-size:15px;color:var(--paper-mut);cursor:pointer}
.tk-fb{margin-top:12px;font-size:16px;line-height:1.8}
.tk-fb:empty{display:none}
.tk-fb .ok{color:var(--grn-d);font-size:19px}
.tk-fb .bad{color:var(--red);font-size:19px}
.tk-fb .hint{color:var(--paper-mut)}
.tk-fb .ex{border-top:3px dashed #d8c08f;padding-top:8px;margin-top:6px}
.tk-next{margin-top:14px}.tk-next:empty{display:none}
.tk-ans{display:none;margin-top:12px;font-size:14px;color:#6a3d8c;background:#efe2f7;padding:6px 10px}
body.teacher .tk-ans{display:block}
.readout{font-size:15px;color:var(--paper-mut);margin-bottom:12px}
.readout b{font-family:var(--f8);font-size:26px;color:var(--paper-ink);font-weight:400;margin-left:8px}
.stamp{position:absolute;right:22px;top:46px;padding:10px 14px;border:5px solid var(--red);color:var(--red);font-size:30px;line-height:1;background:rgba(255,246,226,.85);opacity:0;pointer-events:none;z-index:3}
.stamp.ok{border-color:var(--grn-d);color:var(--grn-d)}
.stamp.show{animation:stamp .3s steps(3) forwards}
@keyframes stamp{0%{opacity:0;transform:scale(2.4)}100%{opacity:1;transform:scale(1)}}
.shake{animation:shake .32s steps(4)}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}

/* bench */
.bench{min-width:0}
.bench.flash{animation:flash .6s steps(2) 3}
@keyframes flash{50%{box-shadow:inset 0 0 0 3px var(--edge),inset 0 0 0 6px var(--yel),inset 0 0 0 9px var(--edge)}}
.cupbox{background:#141a33;padding:8px;box-shadow:inset 0 0 0 3px var(--edge)}
.cupbox canvas{width:100%;height:auto;aspect-ratio:128/76}
.cuplab{display:grid;grid-template-columns:1fr 1fr;text-align:center;font-size:14px;margin-top:6px;color:var(--fg2)}
.cuplab b{font-weight:400;color:var(--yel);font-family:var(--f8);font-size:10px;display:block;margin-top:2px}
.krow{display:flex;align-items:center;gap:10px;margin-top:12px}
.krow label{font-size:15px;white-space:nowrap}
.krow input[type=range]{flex:1;min-width:0;accent-color:var(--yel);height:30px}
.krow .kv{font-family:var(--f8);font-size:16px;color:var(--yel);min-width:4.5ch;text-align:right}
.rt{width:100%;border-collapse:collapse;margin-top:8px;font-size:15px}
.rt td{padding:6px 4px;border-bottom:2px dotted #3b4a8a}
.rt td small{display:block;font-size:12px;color:var(--fg3)}
.rt td:last-child{text-align:right;font-family:var(--f8);font-size:12px;white-space:nowrap}
.rt tr.hl td{color:var(--yel)}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.meter{background:#16204a;padding:10px;clip-path:var(--cut);box-shadow:inset 0 0 0 3px #2e3a72;display:flex;gap:8px;align-items:flex-start;min-width:0}
.meter img{width:40px;height:40px;flex:none}
.meter small{display:block;font-size:12px;color:var(--fg3);line-height:1.4}
.meter .v{font-family:var(--f8);font-size:14px}
.meter p{font-size:13px;line-height:1.5;margin-top:4px;color:var(--fg2)}
.mbar{height:8px;background:#0b0f24;margin-top:4px;position:relative}
.mbar i{position:absolute;inset:0 auto 0 0;transition:width .15s}

/* overlay */
.ov{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:calc(20px + env(safe-area-inset-top,0px)) var(--gr) calc(20px + env(safe-area-inset-bottom,0px)) var(--gl);background:rgba(8,10,24,.78);overflow:auto;animation:fade .15s steps(3) both}
.ov.out{animation:fadeOut .15s steps(3) both}
@keyframes fade{from{opacity:0}}@keyframes fadeOut{to{opacity:0}}
.ovc{width:min(560px,100%);display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 40px);overflow:auto;animation:pop .25s steps(4) both}
@keyframes pop{from{transform:scale(.85)}}
.ovc h2{font-size:28px;line-height:1.3}
.ovc p{font-size:16px;line-height:1.85;color:var(--fg2)}
.ovc.paper p{color:var(--paper-mut)}
.ov-k{font-family:var(--f8);font-size:10px;color:var(--yel)}
.win.paper .ov-k{color:var(--red)}
.ov-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.formula{font-size:24px;line-height:1.7;background:#f3e3c0;padding:12px 14px;box-shadow:inset 0 0 0 3px #d8c08f}
.formula small{display:block;font-size:15px;color:var(--paper-mut)}
.fld{display:flex;flex-direction:column;gap:6px;font-size:15px;color:var(--fg2)}
.fld input{font-family:var(--f);font-size:20px;padding:10px 12px;border:0;background:var(--edge);color:var(--fg);box-shadow:inset 0 0 0 3px #4c5ca8}

  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;if(a[i+3])continue;

  for(let k=0;k<400;k++){R(g,x0,y0,t,t,c);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>-dy){e-=dy;x0+=sx;}if(e2<dx){e+=dx;y0+=sy;}}}

/* =========================================================

/* ================= NES-style sound (original jingles) ================= */
let AC=null,MG=null,NOISE=null;const WAVES={};
function unlockAudio(){try{
  if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=.55;const cp=AC.createDynamicsCompressor();MG.connect(cp);cp.connect(AC.destination);
    [.125,.25,.5].forEach(d=>{const n=40,re=new Float32Array(n),im=new Float32Array(n);for(let k=1;k<n;k++){re[k]=Math.sin(2*Math.PI*k*d)/(k*Math.PI);im[k]=(1-Math.cos(2*Math.PI*k*d))/(k*Math.PI);}WAVES[d]=AC.createPeriodicWave(re,im);});
    const len=Math.floor(AC.sampleRate*.6),buf=AC.createBuffer(1,len,AC.sampleRate),ch=buf.getChannelData(0);let v=0;for(let i=0;i<len;i++){if(i%6===0)v=Math.random()*2-1;ch[i]=v;}NOISE=buf;}
  if(AC.state==='suspended')AC.resume();}catch(e){AC=null;}}
const N=m=>440*Math.pow(2,(m-69)/12);
// pulse / triangle channel with a stepped (NES-like) volume envelope, optional pitch slide and vibrato
function ch(m,t,d,o){o=o||{};const now=AC.currentTime+t,osc=AC.createOscillator(),g=AC.createGain(),f=N(m);
  if(o.tri)osc.type='triangle';else osc.setPeriodicWave(WAVES[o.duty||.25]);
  osc.frequency.setValueAtTime(f,now);if(o.to!=null)osc.frequency.exponentialRampToValueAtTime(N(o.to),now+(o.slide||d));
  if(o.vib){const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=7;lg.gain.value=f*.025;l.connect(lg);lg.connect(osc.frequency);l.start(now+d*.3);l.stop(now+d+.05);}
  const v=o.v||.16,st=8,dc=o.decay==null?1:o.decay;for(let i=0;i<st;i++)g.gain.setValueAtTime(v*Math.pow(1-i/st,dc),now+d*i/st);
  g.gain.setValueAtTime(0,now+d);osc.connect(g);g.connect(MG);osc.start(now);osc.stop(now+d+.03);}
function nz(t,d,o){o=o||{};const now=AC.currentTime+t,s=AC.createBufferSource(),g=AC.createGain(),bf=AC.createBiquadFilter();s.buffer=NOISE;bf.type=o.hp?'highpass':'lowpass';bf.frequency.value=o.f||4000;
  const v=o.v||.2;for(let i=0;i<5;i++)g.gain.setValueAtTime(v*(1-i/5),now+d*i/5);g.gain.setValueAtTime(0,now+d);s.connect(bf);bf.connect(g);g.connect(MG);s.start(now);s.stop(now+d+.03);}
function seq(notes,o){let t=o.at||0;notes.forEach(([m,d])=>{if(m)ch(m,t,d*(o.gate||.9),o);t+=d;});return t;}
function sfx(k){if(S.muted||!AC||!WAVES[.25])return;
  if(k==='blip'){ch(86,0,.022,{duty:.125,v:.05});}
  else if(k==='sel'){ch(79,0,.035,{duty:.25,v:.09});ch(86,.035,.05,{duty:.25,v:.09});}
  else if(k==='enter'){ch(55,0,.16,{duty:.125,to:79,slide:.14,v:.13});ch(67,.15,.22,{duty:.125,to:91,slide:.2,v:.1});}
  else if(k==='coin'){ch(88,0,.045,{duty:.5,v:.09});ch(93,.045,.045,{duty:.5,v:.09});ch(100,.09,.26,{duty:.5,v:.09,decay:2});}
  else if(k==='coinS'){ch(93,0,.04,{duty:.5,v:.035});ch(100,.04,.16,{duty:.5,v:.035,decay:2});}
  else if(k==='ok'){seq([[72,.055],[76,.055],[79,.055],[84,.2]],{duty:.25,v:.12,decay:.6});ch(48,0,.28,{tri:true,v:.35});nz(.165,.05,{hp:true,f:6000,v:.06});}
  else if(k==='bad'){ch(58,0,.09,{duty:.5,v:.13});ch(52,.1,.28,{duty:.5,to:40,slide:.26,v:.13});nz(0,.07,{f:900,v:.18});}
  else if(k==='stamp'){nz(0,.13,{f:1400,v:.32});ch(40,0,.16,{tri:true,to:28,slide:.14,v:.45});}
  else if(k==='star'){seq([[84,.035],[88,.035],[91,.035],[96,.035],[100,.14]],{duty:.125,v:.09,decay:1.5});nz(.14,.12,{hp:true,f:7000,v:.05});}
  else if(k==='lvl'){const e=seq([[67,.09],[72,.09],[76,.09],[79,.18],[76,.09],[84,.42]],{duty:.25,v:.12,decay:.4,vib:false});
    seq([[64,.09],[67,.09],[72,.09],[76,.18],[72,.09],[79,.42]],{duty:.125,v:.06,decay:.4});
    seq([[48,.27],[55,.27],[60,.42]],{tri:true,v:.35,decay:.3});ch(84,e-.42,.42,{duty:.25,v:.001});}
  else if(k==='clear'){
    seq([[72,.12],[74,.12],[76,.12],[79,.24],[0,.06],[77,.12],[79,.12],[84,.6]],{duty:.25,v:.12,decay:.35});
    seq([[67,.12],[71,.12],[72,.12],[76,.24],[0,.06],[74,.12],[76,.12],[79,.6]],{duty:.125,v:.06,decay:.35});
    seq([[48,.36],[0,.06],[53,.24],[55,.24],[60,.6]],{tri:true,v:.38,decay:.25});
    [0,.36,.66,.9].forEach(t=>nz(t,.06,{f:2500,v:.14}));ch(84,1.14,.6,{duty:.25,v:.05,vib:true,decay:.2});}
}

const cvf=$('#fx'),cxf=cvf.getContext('2d');let parts=[],raf=0;
function fit(){cvf.width=innerWidth;cvf.height=innerHeight;}addEventListener('resize',fit);fit();
function burst(x,y,n){if(reduce)return;const cols=['#2a1c15','#ffd34e','#fff3d6','#5ec95a','#ff8fab','#e09a55'];for(let i=0;i<(n||30);i++){const a=Math.random()*6.28,s=2+Math.random()*5;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,c:cols[i%cols.length],l:1,z:4+Math.floor(Math.random()*2)*2});}if(!raf)loop();}
function loop(){cxf.clearRect(0,0,cvf.width,cvf.height);parts=parts.filter(p=>p.l>0);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.l-=.02;cxf.fillStyle=p.c;cxf.fillRect(Math.round(p.x/2)*2,Math.round(p.y/2)*2,p.z,p.z);});raf=parts.length?requestAnimationFrame(loop):0;if(!raf)cxf.clearRect(0,0,cvf.width,cvf.height);}

/* ================= economy / HUD ================= */
function gain(xp,rev,anchor){const before=levelOf(S.xp);S.xp+=xp;S.revenue+=rev;save();
  if(anchor){const[x,y]=centerOf(anchor);if(xp)floatText(x-50,y,'+'+xp+'XP','x');if(rev)setTimeout(()=>floatText(x+10,y,'+$'+rev,'c'),100);}
  if(rev)setTimeout(()=>sfx('coin'),120);updateHud();const after=levelOf(S.xp);if(after>before)setTimeout(()=>levelUp(after),700);}
function levelUp(lv){overlay((o,close)=>{sfx('lvl');o.innerHTML=`<div class="ovc win pad clear lvup"><div class="ov-k">LEVEL UP!</div><div class="lvnum">Lv ${lv}</div><h2>${rankOf(lv)}</h2><p>${esc(pname())} 升職了！新名牌已經別上。</p><div class="ov-row" style="justify-content:center"><button class="pbtn" data-primary>太好了</button></div></div>`;o.querySelector('[data-primary]').onclick=()=>close();});}

  document.querySelectorAll('[data-h="lv"]').forEach(e=>e.textContent=lv);
  document.querySelectorAll('[data-h="xp"]').forEach(e=>e.style.width=pct+'%');
  document.querySelectorAll('[data-h="rev"]').forEach(e=>e.textContent='$'+S.revenue.toLocaleString());
  document.querySelectorAll('[data-h="rank"]').forEach(e=>e.textContent=rankOf(lv));

function drawCups(cv,k){const g=cv.getContext('2d');g.imageSmoothingEnabled=false;g.clearRect(0,0,128,76);
  R(g,0,66,128,1,'#3b4a8a');
  const cup=(cx,s,straw)=>{const H=Math.round(36*s),tw=22*s,bw=15*s,base=65,top=base-H;
    for(let i=0;i<9;i++)R(g,cx-bw*.6+i*bw*.15,base+1,bw*.15,1,'rgba(0,0,0,.35)');
    for(let r=0;r<=H;r++){const y=top+r,f=r/H,half=tw/2-(tw-bw)/2*f,xl=Math.round(cx-half),xr=Math.round(cx+half);
      if(r>Math.round(H*.14)){const lc=f<.35?'#f0c58e':f<.7?'#e0a463':'#c98447';R(g,xl+1,y,xr-xl-1,1,lc);}else R(g,xl+1,y,xr-xl-1,1,'rgba(255,255,255,.12)');
      R(g,xl,y,1,1,'#fff3d6');R(g,xr,y,1,1,'#fff3d6');if(r%3===0&&r>3&&r<H-4)R(g,xl+2,y,1,1,'rgba(255,255,255,.45)');}
    R(g,Math.round(cx-bw/2),base,Math.round(bw)+1,1,'#fff3d6');
    R(g,Math.round(cx-tw/2)-1,top-1,Math.round(tw)+3,2,'#ff9f7a');
    const ps=s>1.15?3:2;let px=Math.round(cx-bw/2)+2;while(px+ps<cx+bw/2-1){R(g,px,base-ps-1,ps,ps,EYE);R(g,px,base-ps-1,1,1,'#7a5a4a');px+=ps+1;}
    px=Math.round(cx-bw/2)+3;while(px+ps<cx+bw/2-2){R(g,px,base-ps*2-2,ps,ps,EYE);px+=ps+2;}
    line(g,cx+Math.round(4*s),top-Math.round(10*s),cx-Math.round(2*s),base-6,straw,2);
    R(g,cx-Math.round(tw/2)-7,top,1,H+1,'#8c95c4');R(g,cx-Math.round(tw/2)-9,top,5,1,'#8c95c4');R(g,cx-Math.round(tw/2)-9,base,5,1,'#8c95c4');};

function showTeacher(){if(!T){titleScreen();return;}const m=tModel(),classes=[...new Set(m.students.map(s=>s.cls))].sort((a,b)=>a.localeCompare(b,'zh-Hant',{numeric:true}));
  setView(`<header class="hud"><div class="hud-l"><img class="px" src="${ICON_LOGO}" alt=""><div class="hud-t"><small>TEACHER</small><b>教師後台・經營紀錄</b></div></div><div class="hud-r" id="hudr"></div></header>
   <div class="tpage"><div class="thead"><h1>全班經營紀錄</h1><p>資料更新於 ${new Date(T.data.at).toLocaleTimeString('zh-TW',{hour12:false,hour:'2-digit',minute:'2-digit'})}。點學生那一列可以看他完整的遊戲過程；「關卡題庫」可以瀏覽每一關的題目與答案。${T.data.truncated?'（紀錄太多，只載入最近 12000 筆）':''}</p></div>
   <div class="win pad" id="tmbox"></div><div id="tstats"></div>
   <div class="tbar"><select id="tCls" aria-label="班級"><option value="all">全部班級</option>${classes.map(c=>`<option value="${esc(c)}"${T.cls===c?' selected':''}>${esc(c)} 班</option>`).join('')}</select><input id="tQ" type="search" placeholder="搜尋姓名或座號" value="${esc(T.q)}" aria-label="搜尋學生">
   <div class="tabs2" role="tablist">${[['students','學生名單'],['diag','迷思診斷'],['price','定價分布'],['feed','最新動態'],['roster','名單核對'],['bank','關卡題庫']].map(([k,n])=>`<button class="chipbtn" role="tab" data-t="${k}" aria-pressed="${T.tab===k}" aria-selected="${T.tab===k}">${n}</button>`).join('')}</div></div>
   <div class="win pad" id="tout"></div></div>`);
  const hr=$('#hudr');
  const bk=E('button','chipbtn','◀ 離開');bk.onclick=()=>{sfx('sel');titleScreen();};
  const rf=E('button','chipbtn','重新整理');rf.onclick=async()=>{rf.textContent='讀取中…';const r=await fetchTeacher(T.key);if(r.ok){T.data=r;const y=scrollY;showTeacher();scrollTo(0,y);sfx('ok');}else{toast('重新整理失敗',r.msg,'!');rf.textContent='重新整理';}};
  const lo=E('button','chipbtn','登出');lo.onclick=()=>{try{sessionStorage.removeItem(TK);sessionStorage.removeItem(TMK);}catch(e){}applyTM();T=null;sfx('sel');titleScreen();toast('已登出教師後台','','↺');};
  hr.append(bk,rf,lo);
  const drawTM=()=>{const b=$('#tmbox');b.innerHTML=tmCard();bindTM(b,drawTM);};drawTM();
  $('#tCls').onchange=e=>{T.cls=e.target.value;renderT(m);};$('#tQ').oninput=e=>{T.q=e.target.value;renderT(m);};
  document.querySelectorAll('.tabs2 .chipbtn').forEach(b=>b.onclick=()=>{T.tab=b.dataset.t;sfx('sel');document.querySelectorAll('.tabs2 .chipbtn').forEach(x=>{x.setAttribute('aria-pressed',String(x===b));x.setAttribute('aria-selected',String(x===b));});renderT(m);});
  renderT(m);}
function renderT(m){const f=tFilter(m),out=$('#tout'),ans=f.logs.filter(l=>l.ev==='作答'),now=Date.now();
  const today=f.students.filter(s=>s.last&&s.last.toDateString()===new Date().toDateString()).length,live=f.students.filter(s=>s.last&&now-s.last<5*60000).length;
  const cleared=f.students.filter(s=>s.stars>0).length,fr=ans.length?Math.round(ans.filter(a=>a.first).length/ans.length*100):null;
  $('#tstats').innerHTML=`<div class="tstats"><div class="win tstat"><b>${f.students.length}</b><span>學生人數</span><small>今天上線 ${today} 人・正在玩 ${live} 人</small></div><div class="win tstat"><b>${cleared}</b><span>終章通過</span><small>${f.students.length?Math.round(cleared/f.students.length*100):0}% 的學生</small></div><div class="win tstat"><b>${fr==null?'—':fr+'%'}</b><span>第一次就答對</span><small>共 ${ans.length} 次作答</small></div><div class="win tstat"><b>${(()=>{const p=f.students.map(s=>+s.price).filter(Boolean);return p.length?'$'+Math.round(p.reduce((a,b)=>a+b,0)/p.length):'—';})()}</b><span>平均大杯定價</span><small>合理區間 $74～$86</small></div><div class="win tstat"><b>${(()=>{const p=f.students.map(s=>s.mins).filter(Boolean);return p.length?(p.reduce((a,b)=>a+b,0)/p.length).toFixed(1)+'分':'—';})()}</b><span>平均遊戲時間</span><small>目標 20 分鐘內</small></div></div>`;
  if(T.tab==='bank'){out.innerHTML=bankHTML();return;}
  if(T.tab==='roster'){out.innerHTML=rosterHTML(m);bindRoster(out);return;}
  if(T.tab!=='bank'&&!f.students.length&&!f.logs.length){out.innerHTML='<div class="tempty">還沒有學生的紀錄。<br>學生從 GitHub Pages 網址進入遊戲、登記上班後，資料就會出現在這裡。</div>';return;}
  if(T.tab==='students'){
    out.innerHTML=`<div class="tscroll"><table class="ttab"><thead><tr><th>班級 座號</th><th>姓名</th><th>店名</th><th>目前進度</th><th>Lv</th><th>研發 設計 品牌 吧台 財務</th><th>總星</th><th>分數</th><th>遊戲時間</th><th>第一次答對率</th><th>大杯定價</th><th>最後上線</th></tr></thead><tbody>${f.students.map((s,i)=>`<tr data-i="${i}" tabindex="0"><td class="n8">${esc(s.cls)}-${esc(s.seat)}</td><td>${s.last&&now-s.last<5*60000?'<span class="live" title="正在玩"></span>':''}${esc(s.name)}${s.chk==='名單外'?'<span class="badx">名單外</span>':''}</td><td>${esc(s.shop)}</td><td>${esc(s.cur)}${s.stars?`<span class="sub">${'★'.repeat(s.stars)}</span>`:''}</td><td class="n8">${s.lv}</td><td>${s.zs.map(c=>`<span class="qc ${c?'ok':''}">${c?esc(c):'—'}</span>`).join('')}</td><td class="n8">${s.tot}</td><td class="n8">${s.score||'—'}</td><td>${s.mins?s.mins+' 分':'—'}</td><td class="n8">${esc(s.fr||'—')}</td><td class="n8">${s.price?'$'+esc(s.price):'—'}</td><td>${rel(s.last)}</td></tr>`).join('')}</tbody></table></div><p class="tempty" style="padding:12px 0 0;text-align:left;font-size:14px">五區依序是：研發部（1-1）、杯身設計室（1-2）、品牌部（1-3）、吧台（1-4）、財務室（終章）。點學生那一列可以看他完整的遊戲過程（進出關卡、每題作答、用時）。</p>`;
    out.querySelectorAll('tbody tr').forEach(tr=>{const go=()=>studentDetail(f.students[+tr.dataset.i],m);tr.onclick=go;tr.onkeydown=e=>{if(e.key==='Enter')go();};});return;}
  if(T.tab==='diag'){
    out.innerHTML=`<div class="dg">${QNO.filter(no=>ans.some(x=>x.qno===no)).length?'':'<div class="tempty">還沒有作答紀錄。</div>'}${QNO.filter(no=>ans.some(x=>x.qno===no)).map(no=>{const a=ans.filter(x=>x.qno===no),n=a.length,first=a.filter(x=>x.first).length,dg={};
      a.forEach(x=>x.diag.split('、').filter(Boolean).forEach(d=>{(dg[d]=dg[d]||[]).push(x.name);}));
      const rows=Object.entries(dg).sort((p,q)=>q[1].length-p[1].length);
      return `<div class="dgq"><h3>${no}・${QNAME[no]}</h3><div class="meta">${n} 人作答・第一次答對 ${n?Math.round(first/n*100):0}%${a.length?`・平均 ${(a.reduce((s,x)=>s+x.sec,0)/n).toFixed(0)} 秒`:''}</div>
        <div class="hbar ok"><span>第一次就答對</span><span class="tr"><i style="width:${n?first/n*100:0}%"></i></span><span class="p8">${first}</span></div>
        ${rows.length?rows.map(([d,names])=>`<div class="hbar"><span>${esc(d)}</span><span class="tr"><i style="width:${n?names.length/n*100:0}%"></i></span><span class="p8">${names.length}</span><span class="who">${[...new Set(names)].slice(0,12).map(esc).join('、')}${new Set(names).size>12?' 等':''}</span></div>`).join(''):'<div class="meta">目前沒有常見迷思紀錄。</div>'}</div>`;}).join('')}</div>`;return;}
  if(T.tab==='price'){
    const firstP=ans.filter(a=>a.qno==='05-4').map(a=>parseInt(a.given.split(' | ')[0].replace('$',''))).filter(x=>!isNaN(x));
    const finalP=f.students.map(s=>+s.price).filter(Boolean);
    const bins=[];for(let x=50;x<=110;x+=5)bins.push(x);
    const hist=(arr,lab)=>{const c=bins.map(b=>arr.filter(v=>v>=b&&v<b+5).length),mx=Math.max(1,...c);
      return `<h3 style="font-size:19px;margin:6px 0 4px">${lab}</h3><div class="hist">${bins.map((b,i)=>`<div><b>${c[i]||''}</b><i class="${b>=74&&b<=85?'ok':b<74?'low':''}" style="height:${c[i]/mx*85}%"></i></div>`).join('')}</div><div class="hlab">${bins.map(b=>`<span>$${b}</span>`).join('')}</div>`;};
    const at60=firstP.filter(v=>v===60).length;
    out.innerHTML=hist(firstP,`第一次提出的價格（${firstP.length} 人）`)+`<p style="font-size:15px;color:var(--fg2);margin:10px 0 22px">綠色是合理區間 $74～$86，紅色是毛利不足。第一次就提 $60（只照高度乘 1.2）的有 <b style="color:var(--yel)">${at60}</b> 人，可以拿來當課堂討論的起點。</p>`+hist(finalP,`最後通過的價格（${finalP.length} 人）`);return;}
  const fe=f.logs.slice(-80).reverse();
  out.innerHTML=`<div class="feed">${fe.map(l=>{let what=esc(l.ev);if(l.ev==='作答')what=`${l.first?'<span class="ok">一次答對</span>':`<span class="bad">試了 ${l.tries} 次</span>`}　${esc(l.qno)} ${esc(QNAME[l.qno]||'')}${l.diag?'　<span class="w">'+esc(l.diag)+'</span>':''}`;else if(l.note)what+='　'+esc(l.note);
    return `<div><span class="w">${rel(l.t)}</span><span><b style="font-weight:400">${esc(l.name)}</b> <span class="w">${esc(l.cls)}-${esc(l.seat)}</span></span><span>${what}</span></div>`;}).join('')||'<div class="tempty">還沒有動態。</div>'}</div>`;}
function rosterHTML(m){const R=(T.data.roster||[]).map(r=>({cls:String(r[0]).trim(),seat:String(+r[1]),name:String(r[2])})).filter(r=>T.cls==='all'||r.cls===T.cls);
  const played=new Set(m.students.map(s=>s.cls+'-'+(+s.seat)));
  const classes=[...new Set(R.map(r=>r.cls))].sort((a,b)=>a.localeCompare(b,'zh-Hant',{numeric:true}));
  const outside=m.students.filter(s=>s.chk==='名單外'&&(T.cls==='all'||s.cls===T.cls));
  let h='';
  if(!R.length)h+='<div class="tempty">還沒有學生名單。名單上傳後，學生登入時會核對班級、座號、姓名，對不上就不能進入遊戲。</div>';
  else{h+=`<p style="color:var(--fg2);font-size:15px;margin-bottom:12px">名單共 ${R.length} 人。學生登入時要「班級＋座號＋姓名」都對得上才能進入遊戲。</p>`;
    h+=classes.map(c=>{const rs=R.filter(r=>r.cls===c),np=rs.filter(r=>!played.has(r.cls+'-'+r.seat)).sort((a,b)=>a.seat-b.seat);
      return `<div class="rcls"><h3>${esc(c)} 班</h3><div class="meta">已登入 ${rs.length-np.length} / ${rs.length} 人${np.length?'・尚未登入：':'・全班都登入過了'}</div>${np.length?`<div class="npl">${np.map(r=>`<span>${esc(r.seat)} ${esc(r.name)}</span>`).join('')}</div>`:''}</div>`;}).join('');
    if(outside.length)h+=`<div class="rcls"><h3 style="color:var(--pink)">名單外的紀錄（${outside.length}）</h3><div class="meta">這些資料和名單對不上，可能是更新名單前登入、或名單本身有誤。</div><div class="npl">${outside.map(s=>`<span>${esc(s.cls)}-${esc(s.seat)} ${esc(s.name)}</span>`).join('')}</div></div>`;}
  h+=`<details class="rup"${R.length?'':' open'}><summary>${R.length?'更新學生名單（會整份取代）':'上傳學生名單'}</summary>
    <p style="font-size:14px;color:var(--fg2)">從 Excel 或 Google 試算表複製「班級、座號、姓名」三欄貼上，一行一位學生。</p>
    <textarea id="rosterIn" placeholder="901	1	王小明&#10;901	2	陳大文"></textarea>
    <div class="ov-row" style="margin-top:8px"><button type="button" class="pbtn sm" id="rosterUp">上傳名單</button><span id="rosterMsg" style="font-size:14px;color:var(--fg2)"></span></div></details>`;
  return h;}
function bindRoster(root){const b=root.querySelector('#rosterUp');if(!b)return;b.onclick=async()=>{const msg=root.querySelector('#rosterMsg');
  const rows=root.querySelector('#rosterIn').value.split(/\n/).map(l=>l.trim().split(/[\t,，\s]+/)).filter(a=>a.length>=3&&/^\d{3,4}$/.test(toHalf(a[0]))&&/^\d+$/.test(toHalf(a[1]))).map(a=>[toHalf(a[0]),String(+toHalf(a[1])),a.slice(2).join('')]);
  if(!rows.length){msg.textContent='沒有讀到資料，請確認每行是「班級 座號 姓名」。';return;}
  b.disabled=true;msg.textContent=`上傳中…（${rows.length} 人）`;
  try{const r=await fetch(logUrl(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'roster',key:T.key,rows})}).then(r=>r.json());
    if(!r.ok){msg.textContent='上傳失敗：'+r.error;b.disabled=false;return;}
    const d=await fetchTeacher(T.key);if(d.ok)T.data=d;sfx('ok');toast('名單已更新',`共 ${r.n} 人`,'名');showTeacher();}
  catch(e){msg.textContent='連不上紀錄服務。';b.disabled=false;}};}
function bankHTML(){return ZONES.map(z=>{const lv=LEVELS[z.id];let n=0;
  const qs=lv.steps.map(st=>{
    if(st.t==='note')return `<div class="qb note"><span class="t">員工手冊：${st.title}</span>　${st.body}${st.sub?'<br>'+st.sub:''}</div>`;
    if(st.t==='price')return `<div class="qb"><div class="h"><b>ORDER ${PRICEQ.no}</b><span>經濟・行銷</span><span>拖動價格滑桿</span></div><div class="p">店長想賣 $60。找出財務長和珍珍都點頭的大杯價錢。</div>
      <div class="a">正解：$74～$86（毛利率 ≥ 55% 且每 100 ml ≤ $10）</div><div class="x">大杯總成本 $${COST}＝864 ml × $0.03＋杯子封膜 $5 × 1.44</div><div class="x">常見錯誤：照高度定價 $60；低於 $74 毛利率不足；高於 $86 每 100 ml 比中杯貴。</div>
      <div class="t">教學提示：可請學生列不等式 (p − ${COST}) ÷ p ≥ 0.55、p ÷ 8.64 ≤ 10。</div></div>`;
    if(st.t!=='q')return '';n++;
    const choice=st.type==='choice';
    const mis=choice?st.choices.map((c,i)=>i!==st.answer&&st.tags&&st.tags[i]?`${c}${st.cu||''} → ${st.tags[i]}`:'').filter(Boolean):(st.diag||[]).map(d=>`${d[0]}${st.unit?' '+st.unit:''} → ${d[3]||d[1]}`);
    return `<div class="qb"><div class="h"><b>ORDER ${st.no}</b><span>${st.tag}</span><span>${choice?'選擇題':'填答題'}</span>${st.free?'<span>猜猜看，不計星等</span>':''}${st.practice?'<span>練習題，不計星等</span>':''}</div>
      <div class="p">${st.prompt}</div>
      ${choice?`<ol type="A">${st.choices.map((c,i)=>`<li class="${i===st.answer?'ok':''}">${c}${st.cu||''}${i===st.answer?'　✓':''}</li>`).join('')}</ol>`:`<div class="a">正解：${st.answer}${st.unit?' '+st.unit:''}</div>`}
      <div class="x">解說：${st.explain}</div>
      ${st.hint?`<div class="x">提示：${st.hint}</div>`:''}
      ${mis.length?`<div class="x">系統會診斷的迷思：${mis.join('；')}</div>`:''}
      ${st.ans?`<div class="t">教學提示：${st.ans}</div>`:''}</div>`;}).join('');
  return `<div class="qb-zone"><h3>0${z.no} ${z.name}・${lv.title}</h3><div class="x" style="color:var(--fg2);margin-bottom:8px">${z.unit}・${z.subj.join('、')}</div>${qs}</div>`;}).join('');}
function studentDetail(s,m){const mine=m.logs.filter(l=>l.cls===s.cls&&l.seat===s.seat).slice().sort((a,b)=>(a.t||0)-(b.t||0));sfx('sel');
  const ans=mine.filter(l=>l.ev==='作答');
  const typ={'作答':'e-ans','進入關卡':'e-start','過關':'e-clear','中途離開':'e-leave'};
  const tlHTML=only=>{let day='',out='';(only?ans:mine).forEach(l=>{const d=l.t?l.t.toLocaleDateString('zh-TW',{month:'numeric',day:'numeric',weekday:'short'}):'';if(d!==day){day=d;out+=`<div class="day">${d}</div>`;}
    let what;if(l.ev==='作答')what=`${esc(l.qno)} ${esc(QNAME[l.qno]||'')}・${l.first?'一次答對':`試了 ${l.tries} 次`}・${l.sec} 秒${l.hint?'・看了提示':''}<div class="g">作答：${esc(l.given||'—')}　→　正解：${esc(l.correct)}${l.diag?'<br>迷思：'+esc(l.diag):''}</div>`;else what=esc(l.note||'');
    out+=`<div class="ev ${typ[l.ev]||''}${l.ev==='作答'&&!l.first?' wr':''}"><span class="tm">${l.t?l.t.toLocaleTimeString('zh-TW',{hour12:false}):''}</span><span class="tp">${esc(l.ev)}</span><span>${what}</span></div>`;});return out||'<div class="tempty">還沒有紀錄。</div>';};
  overlay((o,close)=>{o.innerHTML=`<div class="ovc win pad wide"><div class="ov-k">${esc(s.cls)} 班 ${esc(s.seat)} 號</div><h2>${esc(s.name)}・${esc(s.shop||'（未取店名）')}</h2>
    <p>${s.cur?esc(s.cur)+'・':''}分數 ${s.score||0}・總星 ${s.tot}・遊戲時間 ${s.mins||0} 分・第一次答對率 ${esc(s.fr||'—')}・最後上線 ${rel(s.last)}</p>
    <div class="ov-row"><b style="font-weight:400;color:var(--yel)">遊戲過程（舊到新，共 ${mine.length} 筆）</b><button type="button" class="chipbtn" id="onlyA" aria-pressed="false">只看作答</button></div>
    <div class="tl" id="tl">${tlHTML(false)}</div>
    <div class="ov-row"><button class="pbtn" data-primary>關閉</button></div></div>`;
    const tl=o.querySelector('#tl');tl.scrollTop=tl.scrollHeight;
    o.querySelector('#onlyA').onclick=e=>{const on=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',String(on));tl.innerHTML=tlHTML(on);};
    o.querySelector('[data-primary]').onclick=()=>close();o.addEventListener('click',e=>{if(e.target===o)close();});});}

titleScreen();
if(location.hash==='#teacher')setTimeout(teacherLogin,300);
})();
</script>
